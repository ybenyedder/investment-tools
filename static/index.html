<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schrödinger Bridge & Fundamentals Estimator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container-fluid">
    <h2 class="mb-4">Schrödinger Bridge Finance Estimator</h2>
    
    <div class="row">
        <!-- Controls -->
        <div class="col-md-3">
            <div class="card p-3">
                <h4>Parameters</h4>
                <div class="mb-2">
                    <label>Initial Price</label>
                    <input type="number" id="init_price" class="form-control" value="150.0">
                </div>
                <div class="mb-2">
                    <label>Target Price</label>
                    <input type="number" id="target_price" class="form-control" value="160.0">
                </div>
                <div class="mb-2">
                    <label>Volatility</label>
                    <input type="number" step="0.01" id="volatility" class="form-control" value="0.2">
                </div>
                <div class="mb-2">
                    <label>Algorithm</label>
                    <select id="algorithm" class="form-control">
                        <option value="pure_sb">Schrödinger Bridge Only</option>
                        <option value="kalman">Kalman Filter Only</option>
                        <option value="hybrid">Hybrid (Kalman + Schrödinger Bridge)</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>Entropy (ε)</label>
                    <input type="number" step="0.1" id="epsilon" class="form-control" value="5.0">
                </div>
                <button class="btn btn-outline-success w-100 mt-2" onclick="autoCalibrate()">Auto-Calibrate from History</button>
                <button class="btn btn-primary w-100 mt-2" onclick="runSimulation()">Simulate</button>
                <button class="btn btn-secondary w-100 mt-2" onclick="runHybridSimulation()">Run SB with Kalman Filter</button>
            </div>
            
            <div class="card p-3">
                <h4>Estimates at Target</h4>
                <div class="d-flex justify-content-between"><span>Mean Price:</span> <span id="val_price" class="fw-bold">-</span></div>
                <div class="d-flex justify-content-between"><span>P/E Ratio:</span> <span id="val_per" class="fw-bold">-</span></div>
                <div class="d-flex justify-content-between"><span>ROE:</span> <span id="val_roe" class="fw-bold">-</span></div>
                <div class="d-flex justify-content-between"><span>EBITDA:</span> <span id="val_ebitda" class="fw-bold">-</span></div>
                <hr>
                <div class="d-flex justify-content-between"><span>RSI (14):</span> <span id="val_rsi" class="fw-bold">-</span></div>
                <div class="d-flex justify-content-between"><span>MACD:</span> <span id="val_macd" class="fw-bold">-</span></div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="col-md-9">
            <div class="card p-3">
                <h4>Price Paths (Schrödinger Bridge)</h4>
                <canvas id="priceChart" height="100"></canvas>
            </div>
            <div class="card p-3">
                <h4>Technical Indicators (Mean Path)</h4>
                <canvas id="techChart" height="80"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
